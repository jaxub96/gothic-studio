# Builds GothicStudio.exe on a Windows runner (PyInstaller cannot cross-compile, so this
# cannot be done from a Mac). It runs on every pull request to main, with the exe as a
# run artifact. Once this file is on main it can also be run by hand from the Actions
# tab, or:
#
#     gh workflow run build-windows.yml                        # just build
#     gh workflow run build-windows.yml -f release_tag=v1.1    # ...and attach it to that release
name: Build Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach GothicStudio.exe to this existing release (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write        # only used to upload the exe to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (non-blocking)
        continue-on-error: true
        run: python selftest_workflow.py

      - name: Build
        run: python build_exe.py

      - name: Check the exe exists
        shell: bash
        run: ls -l dist/GothicStudio.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GothicStudio-windows
          path: dist/GothicStudio.exe

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/GothicStudio.exe --clobber
